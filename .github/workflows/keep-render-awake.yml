# Render's free plan puts the site to sleep after 15 minutes without a request,
# and the next visitor waits about a minute for it to boot. A ping every 10
# minutes keeps it awake; one service running all month fits in the 750 free
# hours. Scheduled runs only fire from the default branch and GitHub can start
# them a few minutes late, hence 10 and not 14.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health route
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://fahem-deploy.onrender.com/api/health
