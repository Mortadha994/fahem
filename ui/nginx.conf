server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite emits content-hashed asset filenames, so they are safe to cache
    # hard. index.html is not hashed and must never be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API on the same site, for builds with VITE_API_URL=/api (share mode,
    # docker-compose.share.yml): one public address serves both, so the
    # session cookie is first-party and no CORS is involved. Unused by the
    # default build, which calls localhost:8000 directly.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # /solve/stream is server-sent events: buffering would hold every
        # token until the answer is complete.
        proxy_buffering off;
        proxy_cache off;
        # A solve can wait up to 120s in the Groq queue before streaming.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        # Chapter PDFs go up to 40 MB (MAX_CHAPTER_PDF_BYTES).
        client_max_body_size 45m;
    }

    location / {
        # SPA: unknown paths are client-side routes, not 404s.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
