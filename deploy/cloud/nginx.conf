# nginx for the cloud container: runs as uid 1000, so every path it writes is
# under /tmp and the pid/log paths are not the packaged defaults. start.sh
# replaces __PORT__ with the port the host gives ($PORT).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
daemon off;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen __PORT__;
        server_name _;
        root /home/user/app/ui-dist;

        # Content-hashed asset names: safe to cache hard. index.html is not.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # /solve/stream is server-sent events: buffering would hold every
            # token until the answer is complete.
            proxy_buffering off;
            proxy_cache off;
            # A solve can wait up to 120s in the Groq queue before streaming.
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
            # Chapter PDFs go up to 40 MB.
            client_max_body_size 45m;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
