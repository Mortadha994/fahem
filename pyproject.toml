[project]
name = "fahem"
version = "0.1.0"
description = "Curriculum-grounded algorithmique tutor: RAG retrieval, pinned syntax context, constrained generation."
requires-python = ">=3.12"

[tool.ruff]
# Matches the interpreter the Docker image pins (python:3.12-slim).
target-version = "py312"
line-length = 100
exclude = [".venv", "chroma_db", "ui", "__pycache__", "data"]

[tool.ruff.lint]
# Deliberately close to ruff's defaults plus import sorting. This codebase
# carries a lot of intentional, load-bearing commentary and a few patterns
# that a maximal rule set would fight (re-exported names for backwards
# compatibility, long regex literals in the checker), so the goal here is
# catching real problems - unused imports, undefined names, shadowing - not
# enforcing a house style nobody agreed to.
select = ["E", "F", "W", "I"]
ignore = [
    # Long lines are usually regex literals or French prompt text where
    # wrapping hurts readability more than it helps.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# generate.py and rag_store.py re-export config names purely so existing
# imports elsewhere keep working - F401 "imported but unused" is the point.
"generate.py" = ["F401"]
"rag_store.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
